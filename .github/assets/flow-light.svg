<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">How github-readme-designer works</title>
<desc id="d">Five steps: read the repo, find the proof, pick a look, build the visuals, then check and show a before/after before anything is pushed.</desc>
<style>
.mono { font-family: ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
.serif { font-family: 'Iowan Old Style','Charter','Palatino Linotype',Georgia,serif; }
.sans { font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }

.ship { animation: ship 8s cubic-bezier(.6,0,.4,1) infinite both; }
@keyframes ship { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 85% { transform: translateX(1024px); opacity: 1; } 100% { transform: translateX(1024px); opacity: 0; } }
.s0 { animation: s0 8s linear infinite both; }
@keyframes s0 { 0%,3.0% { fill: #F8FBF9; } 6.0%,96% { fill: #11899B; } 100% { fill: #F8FBF9; } }
.s1 { animation: s1 8s linear infinite both; }
@keyframes s1 { 0%,23.0% { fill: #F8FBF9; } 26.0%,96% { fill: #11899B; } 100% { fill: #F8FBF9; } }
.s2 { animation: s2 8s linear infinite both; }
@keyframes s2 { 0%,43.0% { fill: #F8FBF9; } 46.0%,96% { fill: #11899B; } 100% { fill: #F8FBF9; } }
.s3 { animation: s3 8s linear infinite both; }
@keyframes s3 { 0%,63.0% { fill: #F8FBF9; } 66.0%,96% { fill: #11899B; } 100% { fill: #F8FBF9; } }
.s4 { animation: s4 8s linear infinite both; }
@keyframes s4 { 0%,83.0% { fill: #F8FBF9; } 86.0%,96% { fill: #11899B; } 100% { fill: #F8FBF9; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1280" height="320" rx="18" fill="#E6EFEA"/>
<g><line x1="32" y1="0" x2="32" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="64" y1="0" x2="64" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="96" y1="0" x2="96" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="128" y1="0" x2="128" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="160" y1="0" x2="160" y2="320" stroke="#D3E2DA" stroke-width="1.4"/><line x1="192" y1="0" x2="192" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="224" y1="0" x2="224" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="256" y1="0" x2="256" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="288" y1="0" x2="288" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="320" y1="0" x2="320" y2="320" stroke="#D3E2DA" stroke-width="1.4"/><line x1="352" y1="0" x2="352" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="384" y1="0" x2="384" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="416" y1="0" x2="416" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="448" y1="0" x2="448" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="480" y1="0" x2="480" y2="320" stroke="#D3E2DA" stroke-width="1.4"/><line x1="512" y1="0" x2="512" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="544" y1="0" x2="544" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="576" y1="0" x2="576" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="608" y1="0" x2="608" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="640" y1="0" x2="640" y2="320" stroke="#D3E2DA" stroke-width="1.4"/><line x1="672" y1="0" x2="672" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="704" y1="0" x2="704" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="736" y1="0" x2="736" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="768" y1="0" x2="768" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="800" y1="0" x2="800" y2="320" stroke="#D3E2DA" stroke-width="1.4"/><line x1="832" y1="0" x2="832" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="864" y1="0" x2="864" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="896" y1="0" x2="896" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="928" y1="0" x2="928" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="960" y1="0" x2="960" y2="320" stroke="#D3E2DA" stroke-width="1.4"/><line x1="992" y1="0" x2="992" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="1024" y1="0" x2="1024" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="1056" y1="0" x2="1056" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="1088" y1="0" x2="1088" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="1120" y1="0" x2="1120" y2="320" stroke="#D3E2DA" stroke-width="1.4"/><line x1="1152" y1="0" x2="1152" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="1184" y1="0" x2="1184" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="1216" y1="0" x2="1216" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="1248" y1="0" x2="1248" y2="320" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="32" x2="1280" y2="32" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="64" x2="1280" y2="64" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="96" x2="1280" y2="96" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="128" x2="1280" y2="128" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="160" x2="1280" y2="160" stroke="#D3E2DA" stroke-width="1.4"/><line x1="0" y1="192" x2="1280" y2="192" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="224" x2="1280" y2="224" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="256" x2="1280" y2="256" stroke="#D3E2DA" stroke-width="0.7"/><line x1="0" y1="288" x2="1280" y2="288" stroke="#D3E2DA" stroke-width="0.7"/></g>
<text class="mono" x="64" y="58" font-size="13" letter-spacing="2" fill="#55706A">HOW A README GETS REDESIGNED</text><line x1="128" y1="132" x2="1152" y2="132" stroke="#A9BDB5" stroke-width="2" stroke-dasharray="6 7"/><circle class="s0" cx="128" cy="132" r="15" fill="#11899B" stroke="#11899B" stroke-width="3"/><text class="mono" x="128" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#13302A">1</text><text class="serif" x="128" y="188" font-size="23" text-anchor="middle" fill="#13302A">Read the repo</text><text class="mono" x="128" y="220" font-size="14" text-anchor="middle" fill="#55706A">code, docs, sample data</text><text class="mono" x="128" y="241" font-size="14" text-anchor="middle" fill="#55706A">and the old README</text><circle class="s1" cx="384" cy="132" r="15" fill="#11899B" stroke="#11899B" stroke-width="3"/><text class="mono" x="384" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#13302A">2</text><text class="serif" x="384" y="188" font-size="23" text-anchor="middle" fill="#13302A">Find the proof</text><text class="mono" x="384" y="220" font-size="14" text-anchor="middle" fill="#55706A">real results, real output;</text><text class="mono" x="384" y="241" font-size="14" text-anchor="middle" fill="#55706A">runs it when it's safe</text><circle class="s2" cx="640" cy="132" r="15" fill="#11899B" stroke="#11899B" stroke-width="3"/><text class="mono" x="640" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#13302A">3</text><text class="serif" x="640" y="188" font-size="23" text-anchor="middle" fill="#13302A">Pick a look</text><text class="mono" x="640" y="220" font-size="14" text-anchor="middle" fill="#55706A">a palette and one signature</text><text class="mono" x="640" y="241" font-size="14" text-anchor="middle" fill="#55706A">from the project's world</text><circle class="s3" cx="896" cy="132" r="15" fill="#11899B" stroke="#11899B" stroke-width="3"/><text class="mono" x="896" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#13302A">4</text><text class="serif" x="896" y="188" font-size="23" text-anchor="middle" fill="#13302A">Build visuals</text><text class="mono" x="896" y="220" font-size="14" text-anchor="middle" fill="#55706A">animated SVG, light + dark,</text><text class="mono" x="896" y="241" font-size="14" text-anchor="middle" fill="#55706A">desktop + phone</text><circle class="s4" cx="1152" cy="132" r="15" fill="#11899B" stroke="#11899B" stroke-width="3"/><text class="mono" x="1152" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#13302A">5</text><text class="serif" x="1152" y="188" font-size="23" text-anchor="middle" fill="#13302A">Before / after</text><text class="mono" x="1152" y="220" font-size="14" text-anchor="middle" fill="#55706A">checked, then side by side,</text><text class="mono" x="1152" y="241" font-size="14" text-anchor="middle" fill="#55706A">before anything is pushed</text><circle class="ship" cx="128" cy="132" r="6" fill="#13302A"/>
</svg>
