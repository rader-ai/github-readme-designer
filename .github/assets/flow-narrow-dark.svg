<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
<title id="t">How github-readme-designer works</title>
<desc id="d">Five steps: read the repo, find the proof, pick a look, build the visuals, then check and show a before/after before anything is pushed.</desc>
<style>
.mono { font-family: ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
.serif { font-family: 'Iowan Old Style','Charter','Palatino Linotype',Georgia,serif; }
.sans { font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }

.ship { animation: ship 8s cubic-bezier(.6,0,.4,1) infinite both; }
@keyframes ship { 0% { transform: translateY(0); opacity: 0; } 5% { opacity: 1; } 85% { transform: translateY(512px); opacity: 1; } 100% { transform: translateY(512px); opacity: 0; } }
.s0 { animation: s0 8s linear infinite both; }
@keyframes s0 { 0%,3.0% { fill: #11251F; } 6.0%,96% { fill: #3CC4D6; } 100% { fill: #11251F; } }
.s1 { animation: s1 8s linear infinite both; }
@keyframes s1 { 0%,23.0% { fill: #11251F; } 26.0%,96% { fill: #3CC4D6; } 100% { fill: #11251F; } }
.s2 { animation: s2 8s linear infinite both; }
@keyframes s2 { 0%,43.0% { fill: #11251F; } 46.0%,96% { fill: #3CC4D6; } 100% { fill: #11251F; } }
.s3 { animation: s3 8s linear infinite both; }
@keyframes s3 { 0%,63.0% { fill: #11251F; } 66.0%,96% { fill: #3CC4D6; } 100% { fill: #11251F; } }
.s4 { animation: s4 8s linear infinite both; }
@keyframes s4 { 0%,83.0% { fill: #11251F; } 86.0%,96% { fill: #3CC4D6; } 100% { fill: #11251F; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="640" height="700" rx="18" fill="#0D1C18"/>
<g><line x1="32" y1="0" x2="32" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="64" y1="0" x2="64" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="96" y1="0" x2="96" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="128" y1="0" x2="128" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="160" y1="0" x2="160" y2="700" stroke="#152C26" stroke-width="1.4"/><line x1="192" y1="0" x2="192" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="224" y1="0" x2="224" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="256" y1="0" x2="256" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="288" y1="0" x2="288" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="320" y1="0" x2="320" y2="700" stroke="#152C26" stroke-width="1.4"/><line x1="352" y1="0" x2="352" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="384" y1="0" x2="384" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="416" y1="0" x2="416" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="448" y1="0" x2="448" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="480" y1="0" x2="480" y2="700" stroke="#152C26" stroke-width="1.4"/><line x1="512" y1="0" x2="512" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="544" y1="0" x2="544" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="576" y1="0" x2="576" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="608" y1="0" x2="608" y2="700" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="32" x2="640" y2="32" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="64" x2="640" y2="64" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="96" x2="640" y2="96" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="128" x2="640" y2="128" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="160" x2="640" y2="160" stroke="#152C26" stroke-width="1.4"/><line x1="0" y1="192" x2="640" y2="192" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="224" x2="640" y2="224" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="256" x2="640" y2="256" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="288" x2="640" y2="288" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="320" x2="640" y2="320" stroke="#152C26" stroke-width="1.4"/><line x1="0" y1="352" x2="640" y2="352" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="384" x2="640" y2="384" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="416" x2="640" y2="416" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="448" x2="640" y2="448" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="480" x2="640" y2="480" stroke="#152C26" stroke-width="1.4"/><line x1="0" y1="512" x2="640" y2="512" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="544" x2="640" y2="544" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="576" x2="640" y2="576" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="608" x2="640" y2="608" stroke="#152C26" stroke-width="0.7"/><line x1="0" y1="640" x2="640" y2="640" stroke="#152C26" stroke-width="1.4"/><line x1="0" y1="672" x2="640" y2="672" stroke="#152C26" stroke-width="0.7"/></g>
<text class="mono" x="40" y="58" font-size="13" letter-spacing="2" fill="#8FA9A1">HOW A README GETS REDESIGNED</text><line x1="70" y1="126" x2="70" y2="638" stroke="#35524A" stroke-width="2" stroke-dasharray="6 7"/><circle class="s0" cx="70" cy="126" r="15" fill="#3CC4D6" stroke="#3CC4D6" stroke-width="3"/><text class="mono" x="70" y="131" font-size="13" font-weight="700" text-anchor="middle" fill="#E6F0EC">1</text><text class="serif" x="110" y="132" font-size="26" fill="#E6F0EC">Read the repo</text><text class="mono" x="110" y="160" font-size="15" fill="#8FA9A1">code, docs, sample data</text><text class="mono" x="110" y="182" font-size="15" fill="#8FA9A1">and the old README</text><circle class="s1" cx="70" cy="254" r="15" fill="#3CC4D6" stroke="#3CC4D6" stroke-width="3"/><text class="mono" x="70" y="259" font-size="13" font-weight="700" text-anchor="middle" fill="#E6F0EC">2</text><text class="serif" x="110" y="260" font-size="26" fill="#E6F0EC">Find the proof</text><text class="mono" x="110" y="288" font-size="15" fill="#8FA9A1">real results, real output;</text><text class="mono" x="110" y="310" font-size="15" fill="#8FA9A1">runs it when it's safe</text><circle class="s2" cx="70" cy="382" r="15" fill="#3CC4D6" stroke="#3CC4D6" stroke-width="3"/><text class="mono" x="70" y="387" font-size="13" font-weight="700" text-anchor="middle" fill="#E6F0EC">3</text><text class="serif" x="110" y="388" font-size="26" fill="#E6F0EC">Pick a look</text><text class="mono" x="110" y="416" font-size="15" fill="#8FA9A1">a palette and one signature</text><text class="mono" x="110" y="438" font-size="15" fill="#8FA9A1">from the project's world</text><circle class="s3" cx="70" cy="510" r="15" fill="#3CC4D6" stroke="#3CC4D6" stroke-width="3"/><text class="mono" x="70" y="515" font-size="13" font-weight="700" text-anchor="middle" fill="#E6F0EC">4</text><text class="serif" x="110" y="516" font-size="26" fill="#E6F0EC">Build visuals</text><text class="mono" x="110" y="544" font-size="15" fill="#8FA9A1">animated SVG, light + dark,</text><text class="mono" x="110" y="566" font-size="15" fill="#8FA9A1">desktop + phone</text><circle class="s4" cx="70" cy="638" r="15" fill="#3CC4D6" stroke="#3CC4D6" stroke-width="3"/><text class="mono" x="70" y="643" font-size="13" font-weight="700" text-anchor="middle" fill="#E6F0EC">5</text><text class="serif" x="110" y="644" font-size="26" fill="#E6F0EC">Before / after</text><text class="mono" x="110" y="672" font-size="15" fill="#8FA9A1">checked, then side by side,</text><text class="mono" x="110" y="694" font-size="15" fill="#8FA9A1">before anything is pushed</text><circle class="ship" cx="70" cy="126" r="6" fill="#E6F0EC"/>
</svg>
